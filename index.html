<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CYBER LUDO 2099</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body {
      background: #030712;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px 0 20px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f0ff, #7000ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0,240,255,0.4);
    }
    .status-panel {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 8px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    /* Board Container */
    #board-wrap {
      width: min(94vw, 420px);
      height: min(94vw, 420px);
      background: #090d16;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,240,255,0.25), inset 0 0 15px rgba(0,0,0,0.8);
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
    }

    /* Controls Panel */
    .controls-panel {
      width: min(94vw, 420px);
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .player-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .neon-indicator-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .player-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
    }
    .player-text span {
      display: block;
      font-size: 1rem;
      color: #fff;
    }

    /* Cyber Holographic Dice */
    .dice-container {
      width: 65px;
      height: 65px;
      background: radial-gradient(circle, #1e1b4b 0%, #090d16 100%);
      border: 2px solid #7000ff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      color: #00f0ff;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(112, 0, 255, 0.4);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .dice-container.rolling {
      animation: cyberRoll 0.4s infinite ease-in-out;
    }
    @keyframes cyberRoll {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.1); box-shadow: 0 0 25px #ff007f; color: #ff007f; }
      100% { transform: rotate(360deg) scale(0.9); }
    }

    /* Actions & Multiplayer Room Controls */
    .action-grid {
      width: min(94vw, 420px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    button, input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      text-align: center;
    }
    .btn-neon {
      background: linear-gradient(135deg, #0284c7, #7000ff);
      border: none;
      box-shadow: 0 0 12px rgba(112, 0, 255, 0.4);
    }
    .btn-wa {
      background: #059669;
      border: none;
      grid-column: span 2;
    }
    .mp-box {
      width: min(94vw, 420px);
      margin-top: 8px;
      display: flex;
      gap: 6px;
    }
    .mp-box input {
      flex: 1;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Cyber Ludo 2099</h1>
  </header>

  <div class="status-panel" id="turnStatus">System Ready // Roll To Start</div>

  <div id="board-wrap">
    <canvas id="ludoCanvas" width="600" height="600"></canvas>
  </div>

  <div class="controls-panel">
    <div class="player-indicator">
      <div class="neon-indicator-dot" id="turnColorDot"></div>
      <div class="player-text">Current Turn<span id="turnPlayerName">Cyan Core (You)</span></div>
    </div>
    <div class="dice-container" id="diceBtn" onclick="userRollDice()">?</div>
  </div>

  <div class="action-grid">
    <button class="btn-neon" onclick="resetGame(true)">Solo vs AI Bots</button>
    <button class="btn-neon" style="background: linear-gradient(135deg, #7000ff, #ff007f);" onclick="hostRoom()">Host Online</button>
    <button class="btn-wa" id="waShareBtn" style="display:none;" onclick="shareWhatsApp()">Share Room on WhatsApp</button>
  </div>

  <div class="mp-box">
    <input type="text" id="joinRoomCode" placeholder="Enter Room Code" />
    <button class="btn-neon" onclick="joinRoom()">Join Match</button>
  </div>

  <script>
    // --- Futuristic Audio Engine ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      playSynth(freq, type = 'sine', duration = 0.1, stopFade = true) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        if (stopFade) gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      },
      rollSound() { this.playSynth(520, 'sawtooth', 0.15); },
      moveSound() { this.playSynth(300, 'triangle', 0.08); },
      killSound() {
        this.playSynth(180, 'square', 0.25);
        setTimeout(() => this.playSynth(80, 'sawtooth', 0.3), 100);
      }
    };

    // --- Colors & Cyber Board Map Coordinates ---
    const COLORS = {
      0: { name: 'Cyan Core', hex: '#00f0ff', glow: 'rgba(0,240,255,0.6)', home: 0 },
      1: { name: 'Amber Core', hex: '#f59e0b', glow: 'rgba(245,158,11,0.6)', home: 13 },
      2: { name: 'Emerald Core', hex: '#10b981', glow: 'rgba(16,185,129,0.6)', home: 26 },
      3: { name: 'Magenta Core', hex: '#ff007f', glow: 'rgba(255,0,127,0.6)', home: 39 }
    };

    // 52 Step Global Perimeter Track (15x15 standard grid map)
    const TRACK = [
      {x:1, y:6},{x:2, y:6},{x:3, y:6},{x:4, y:6},{x:5, y:6},
      {x:6, y:5},{x:6, y:4},{x:6, y:3},{x:6, y:2},{x:6, y:1},{x:6, y:0},
      {x:7, y:0},
      {x:8, y:0},{x:8, y:1},{x:8, y:2},{x:8, y:3},{x:8, y:4},{x:8, y:5},
      {x:9, y:6},{x:10, y:6},{x:11, y:6},{x:12, y:6},{x:13, y:6},{x:14, y:6},
      {x:14, y:7},
      {x:14, y:8},{x:13, y:8},{x:12, y:8},{x:11, y:8},{x:10, y:8},{x:9, y:8},
      {x:8, y:9},{x:8, y:10},{x:8, y:11},{x:8, y:12},{x:8, y:13},{x:8, y:14},
      {x:7, y:14},
      {x:6, y:14},{x:6, y:13},{x:6, y:12},{x:6, y:11},{x:6, y:10},{x:6, y:9},
      {x:5, y:8},{x:4, y:8},{x:3, y:8},{x:2, y:8},{x:1, y:8},{x:0, y:8},
      {x:0, y:7},{x:0, y:6}
    ];

    // Safe Shield Zones (Star Bases)
    const SAFE_POINTS = [0, 8, 13, 21, 26, 34, 39, 47];

    // Home Stretch Steps to Victory (6 Steps per Player)
    const HOME_RUNS = {
      0: [{x:1,y:7},{x:2,y:7},{x:3,y:7},{x:4,y:7},{x:5,y:7},{x:6,y:7}],
      1: [{x:7,y:1},{x:7,y:2},{x:7,y:3},{x:7,y:4},{x:7,y:5},{x:7,y:6}],
      2: [{x:13,y:7},{x:12,y:7},{x:11,y:7},{x:10,y:7},{x:9,y:7},{x:8,y:7}],
      3: [{x:7,y:13},{x:7,y:12},{x:7,y:11},{x:7,y:10},{x:7,y:9},{x:7,y:8}]
    };

    // Bases Starting Positions
    const BASE_LOCS = {
      0: [{x:2,y:2},{x:3,y:2},{x:2,y:3},{x:3,y:3}],
      1: [{x:11,y:2},{x:12,y:2},{x:11,y:3},{x:12,y:3}],
      2: [{x:11,y:11},{x:12,y:11},{x:11,y:12},{x:12,y:12}],
      3: [{x:2,y:11},{x:3,y:11},{x:2,y:12},{x:3,y:12}]
    };

    // --- Game State Engine ---
    let players = {};
    let turn = 0; // 0: Cyan, 1: Amber, 2: Emerald, 3: Magenta
    let currentDice = null;
    let hasRolled = false;
    let isRolling = false;
    let vsBots = true;
    let peer = null;
    let conn = null;

    function initTokens() {
      players = {};
      for (let p = 0; p < 4; p++) {
        players[p] = [
          { id: 0, state: 'base', pos: -1, step: 0 },
          { id: 1, state: 'base', pos: -1, step: 0 },
          { id: 2, state: 'base', pos: -1, step: 0 },
          { id: 3, state: 'base', pos: -1, step: 0 }
        ];
      }
    }

    const canvas = document.getElementById('ludoCanvas');
    const ctx = canvas.getContext('2d');
    const SZ = 600 / 15; // 40px per grid cell

    function drawBoard() {
      ctx.fillStyle = '#040711';
      ctx.fillRect(0, 0, 600, 600);

      // Grid Wireframe
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 15; i++) {
        ctx.beginPath();
        ctx.moveTo(i * SZ, 0); ctx.lineTo(i * SZ, 600);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * SZ); ctx.lineTo(600, i * SZ);
        ctx.stroke();
      }

      // 4 Cyber Command Bases (Quadrants)
      drawBase(0, 0, COLORS[0]);
      drawBase(9 * SZ, 0, COLORS[1]);
      drawBase(9 * SZ, 9 * SZ, COLORS[2]);
      drawBase(0, 9 * SZ, COLORS[3]);

      // Center Cyber Portal
      drawCenterNexus();

      // Safe Shield Checkpoints
      SAFE_POINTS.forEach(idx => {
        const pt = TRACK[idx];
        ctx.save();
        ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
        ctx.beginPath();
        ctx.arc((pt.x + 0.5) * SZ, (pt.y + 0.5) * SZ, SZ * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      });

      // Draw Home Stretch Light Runes
      for (let p = 0; p < 4; p++) {
        HOME_RUNS[p].forEach(c => {
          ctx.fillStyle = COLORS[p].glow;
          ctx.fillRect(c.x * SZ + 3, c.y * SZ + 3, SZ - 6, SZ - 6);
        });
      }

      // Render Holographic Tokens
      for (let p = 0; p < 4; p++) {
        players[p].forEach((tok, i) => {
          let coords = { x: 0, y: 0 };
          if (tok.state === 'base') {
            coords = BASE_LOCS[p][i];
          } else if (tok.state === 'run') {
            coords = TRACK[tok.pos];
          } else if (tok.state === 'home') {
            coords = HOME_RUNS[p][tok.step - 52];
          } else if (tok.state === 'done') {
            coords = { x: 7, y: 7 };
          }
          drawToken((coords.x + 0.5) * SZ, (coords.y + 0.5) * SZ, COLORS[p], tok, p === turn && hasRolled);
        });
      }
    }

    function drawBase(x, y, color) {
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
      ctx.fillRect(x, y, 6 * SZ, 6 * SZ);
      ctx.strokeStyle = color.hex;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 4, y + 4, 6 * SZ - 8, 6 * SZ - 8);

      ctx.fillStyle = color.glow;
      ctx.beginPath();
      ctx.arc(x + 3 * SZ, y + 3 * SZ, 2.2 * SZ, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCenterNexus() {
      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(6 * SZ, 6 * SZ, 3 * SZ, 3 * SZ);
      const grad = ctx.createRadialGradient(300, 300, 5, 300, 300, 60);
      grad.addColorStop(0, '#00f0ff');
      grad.addColorStop(0.5, '#7000ff');
      grad.addColorStop(1, '#090d16');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(300, 300, SZ * 1.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawToken(x, y, color, token, canMove) {
      ctx.save();
      // Outer Cyber Ring
      ctx.beginPath();
      ctx.arc(x, y, SZ * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = color.hex;
      ctx.shadowColor = color.hex;
      ctx.shadowBlur = canMove ? 16 : 6;
      ctx.fill();

      // Inner Core
      ctx.beginPath();
      ctx.arc(x, y, SZ * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = '#030712';
      ctx.fill();

      if (canMove) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, SZ * 0.44, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // --- Dice & Rules Engine ---
    function userRollDice() {
      AudioEngine.init();
      if (hasRolled || isRolling) return;
      if (turn !== 0 && vsBots) return; // Wait for bot turns

      executeRoll();
    }

    function executeRoll() {
      isRolling = true;
      const diceEl = document.getElementById('diceBtn');
      diceEl.classList.add('rolling');
      AudioEngine.rollSound();

      setTimeout(() => {
        diceEl.classList.remove('rolling');
        currentDice = Math.floor(Math.random() * 6) + 1;
        diceEl.innerText = currentDice;
        isRolling = false;
        hasRolled = true;

        evaluateAvailableMoves();
      }, 350);
    }

    function evaluateAvailableMoves() {
      const activeTokens = players[turn];
      const valid = activeTokens.filter(tok => canMoveToken(tok, currentDice));

      if (valid.length === 0) {
        document.getElementById('turnStatus').innerText = `Rolled a ${currentDice}. No legal moves!`;
        setTimeout(nextTurn, 1000);
      } else {
        document.getElementById('turnStatus').innerText = `Rolled a ${currentDice}. Tap your token to move!`;
        if (turn !== 0 && vsBots) {
          // AI makes smart choice after brief calculation
          setTimeout(() => botMove(valid), 700);
        }
      }
      drawBoard();
    }

    function canMoveToken(tok, roll) {
      if (tok.state === 'done') return false;
      if (tok.state === 'base') return roll === 6;
      return (tok.step + roll) <= 57;
    }

    // Canvas Tap to Select Token
    canvas.addEventListener('pointerdown', (e) => {
      if (!hasRolled || isRolling) return;
      if (turn !== 0 && vsBots) return;

      const rect = canvas.getBoundingClientRect();
      const scale = 600 / rect.width;
      const clickX = (e.clientX - rect.left) * scale;
      const clickY = (e.clientY - rect.top) * scale;

      const myTokens = players[turn];
      for (let tok of myTokens) {
        if (!canMoveToken(tok, currentDice)) continue;

        let loc = getTokScreenLoc(tok, turn);
        if (Math.hypot(clickX - loc.x, clickY - loc.y) < SZ * 0.7) {
          moveToken(tok);
          break;
        }
      }
    });

    function getTokScreenLoc(tok, p) {
      let c = { x: 0, y: 0 };
      if (tok.state === 'base') c = BASE_LOCS[p][tok.id];
      else if (tok.state === 'run') c = TRACK[tok.pos];
      else if (tok.state === 'home') c = HOME_RUNS[p][tok.step - 52];
      else c = { x: 7, y: 7 };
      return { x: (c.x + 0.5) * SZ, y: (c.y + 0.5) * SZ };
    }

    function moveToken(tok) {
      AudioEngine.moveSound();

      if (tok.state === 'base') {
        tok.state = 'run';
        tok.pos = COLORS[turn].home;
        tok.step = 0;
      } else {
        tok.step += currentDice;
        if (tok.step < 52) {
          tok.pos = (tok.pos + currentDice) % 52;
          checkElimination(tok);
        } else if (tok.step < 57) {
          tok.state = 'home';
        } else if (tok.step === 57) {
          tok.state = 'done';
          AudioEngine.killSound();
        }
      }

      drawBoard();

      // Check Winner
      if (players[turn].every(t => t.state === 'done')) {
        alert(`${COLORS[turn].name} HAS CONQUERED CYBER LUDO!`);
        resetGame(vsBots);
        return;
      }

      // Bonus roll on a 6
      if (currentDice === 6) {
        hasRolled = false;
        document.getElementById('turnStatus').innerText = `ROLLED A 6! Bonus Turn Activated.`;
        if (turn !== 0 && vsBots) setTimeout(executeRoll, 700);
      } else {
        nextTurn();
      }
    }

    function checkElimination(tok) {
      if (SAFE_POINTS.includes(tok.pos)) return;

      for (let p = 0; p < 4; p++) {
        if (p === turn) continue;
        players[p].forEach(opp => {
          if (opp.state === 'run' && opp.pos === tok.pos) {
            opp.state = 'base';
            opp.pos = -1;
            opp.step = 0;
            AudioEngine.killSound();
            document.getElementById('turnStatus').innerText = `ELIMINATION! Core blasted to base.`;
          }
        });
      }
    }

    function nextTurn() {
      hasRolled = false;
      turn = (turn + 1) % 4;
      document.getElementById('diceBtn').innerText = '?';

      const curColor = COLORS[turn];
      document.getElementById('turnColorDot').style.background = curColor.hex;
      document.getElementById('turnColorDot').style.boxShadow = `0 0 10px ${curColor.hex}`;
      document.getElementById('turnPlayerName').innerText = curColor.name;
      document.getElementById('turnStatus').innerText = `${curColor.name}'s Turn // Awaiting Roll`;

      drawBoard();

      if (turn !== 0 && vsBots) {
        setTimeout(executeRoll, 700);
      }
    }

    function botMove(valid) {
      // Prioritize killing opponent, then leaving base, then closest to home
      let chosen = valid[0];
      for (let tok of valid) {
        if (tok.state === 'base') { chosen = tok; break; }
        if (tok.step > chosen.step) chosen = tok;
      }
      moveToken(chosen);
    }

    function resetGame(enableBots = true) {
      vsBots = enableBots;
      turn = 0;
      hasRolled = false;
      isRolling = false;
      initTokens();
      drawBoard();

      document.getElementById('diceBtn').innerText = '?';
      document.getElementById('turnColorDot').style.background = COLORS[0].hex;
      document.getElementById('turnPlayerName').innerText = COLORS[0].name + ' (You)';
      document.getElementById('turnStatus').innerText = 'Game Initialized // Ready';
    }

    // --- Online Multiplayer & WhatsApp ---
    function hostRoom() {
      AudioEngine.init();
      vsBots = false;
      const code = 'ludo-' + Math.random().toString(36).substring(2, 7);
      peer = new Peer(code);

      peer.on('open', (id) => {
        document.getElementById('waShareBtn').style.display = 'block';
        document.getElementById('joinRoomCode').value = id;
        document.getElementById('turnStatus').innerText = `Room Active: ${id}. Waiting for friend...`;
      });

      peer.on('connection', (c) => {
        conn = c;
        setupP2P();
        document.getElementById('turnStatus').innerText = `Player Connected! Roll to battle.`;
      });
      resetGame(false);
    }

    function joinRoom() {
      AudioEngine.init();
      vsBots = false;
      const code = document.getElementById('joinRoomCode').value.trim();
      if (!code) return alert('Enter room code first!');

      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(code);
        setupP2P();
        document.getElementById('turnStatus').innerText = `Connected to match!`;
        resetGame(false);
      });
    }

    function setupP2P() {
      conn.on('data', (data) => {
        if (data.type === 'state') {
          players = data.players;
          turn = data.turn;
          currentDice = data.currentDice;
          drawBoard();
        }
      });
    }

    function shareWhatsApp() {
      const code = document.getElementById('joinRoomCode').value;
      const text = `Join my Cyber Ludo 2099 match! Room Code: ${code}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    // Start
    initTokens();
    drawBoard();
  </script>
</body>
</html>

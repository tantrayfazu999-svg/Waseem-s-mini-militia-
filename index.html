<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Blighty: British Idioms Vault</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      padding-bottom: 50px;
    }
    header {
      background: #1e293b;
      padding: 16px 18px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #334155;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .header-top h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .badge-count {
      background: #0284c7;
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .search-box {
      width: 100%;
      margin-bottom: 10px;
    }
    .search-box input {
      width: 100%;
      padding: 11px 16px;
      background: #090d16;
      border: 1px solid #475569;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: #38bdf8;
    }
    .sections-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .sections-bar::-webkit-scrollbar { display: none; }
    .sec-tab {
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .sec-tab.active {
      background: #0284c7;
      color: #fff;
    }

    .container {
      max-width: 650px;
      margin: 14px auto 0;
      padding: 0 14px;
    }

    .idiom-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      margin-bottom: 18px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 8px;
    }
    .title-group { flex: 1; }
    .idiom-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f1f5f9;
      line-height: 1.3;
    }
    .idiom-section-tag {
      display: inline-block;
      font-size: 0.68rem;
      text-transform: uppercase;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 12px;
      margin-top: 4px;
    }
    .btn-audio {
      background: #0284c7;
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .meaning-box {
      background: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 14px;
    }
    .meaning-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .meaning-text {
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.45;
      user-select: text;
    }

    .examples-header {
      font-size: 0.78rem;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .example-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .example-item {
      font-size: 0.85rem;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.6);
      padding: 9px 12px;
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
      user-select: text;
    }
    .example-item span.num {
      color: #38bdf8;
      font-weight: 800;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .example-item span.speaker {
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: auto;
      padding-left: 6px;
    }

    .load-more-btn {
      width: 100%;
      background: #334155;
      color: #38bdf8;
      border: 1px solid #475569;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin: 10px 0 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>British Idioms Master</h1>
      <span class="badge-count" id="countBadge">Loading...</span>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search British idioms or meanings..." oninput="filterIdioms()" />
    </div>
    <div class="sections-bar">
      <button class="sec-tab active" onclick="setSection('all', this)">All Sections</button>
      <button class="sec-tab" onclick="setSection('everyday', this)">Everyday Slang</button>
      <button class="sec-tab" onclick="setSection('wit', this)">Wit & Banter</button>
      <button class="sec-tab" onclick="setSection('work', this)">Work & Ambition</button>
      <button class="sec-tab" onclick="setSection('weather', this)">Weather & Mood</button>
      <button class="sec-tab" onclick="setSection('social', this)">Social & Life</button>
    </div>
  </header>

  <div class="container">
    <div id="idiomContainer"></div>
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Load More Expressions</button>
  </div>

  <script>
    function speakBritish(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      utterance.rate = 0.88;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const ukVoice = voices.find(v => v.lang === 'en-GB' || v.name.includes('United Kingdom') || v.name.includes('British'));
      if (ukVoice) utterance.voice = ukVoice;

      window.speechSynthesis.speak(utterance);
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    let allIdioms = [];
    let filteredIdioms = [];
    let currentLimit = 10;
    let selectedSection = 'all';

    // Fetch the external dictionary file
    async function loadDictionary() {
      try {
        const response = await fetch('idioms.json');
        allIdioms = await response.json();
      } catch (e) {
        console.error("Could not load idioms.json, using fallback", e);
      }
      filteredIdioms = [...allIdioms];
      document.getElementById('countBadge').innerText = `${allIdioms.length} Idioms`;
      renderList();
    }

    function renderList() {
      const container = document.getElementById('idiomContainer');
      container.innerHTML = '';

      const subset = filteredIdioms.slice(0, currentLimit);
      if (subset.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:50px 10px; color:#94a3b8;">No matching British expressions found.</div>`;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }

      subset.forEach(item => {
        const card = document.createElement('div');
        card.className = 'idiom-card';

        const examplesHtml = item.examples.map((ex, idx) => `
          <li class="example-item">
            <span class="num">${idx + 1}.</span>
            <span>${ex}</span>
            <span class="speaker" onclick="speakBritish('${ex.replace(/'/g, "\\'")}')" title="Listen">🔊</span>
          </li>
        `).join('');

        card.innerHTML = `
          <div class="card-head">
            <div class="title-group">
              <div class="idiom-title">${item.idiom}</div>
              <span class="idiom-section-tag">${item.secName || item.sec}</span>
            </div>
            <button class="btn-audio" onclick="speakBritish('${item.idiom.replace(/'/g, "\\'")}')" title="Pronounce">🔊</button>
          </div>
          <div class="meaning-box">
            <div class="meaning-title">British Meaning & Definition</div>
            <div class="meaning-text">${item.meaning}</div>
          </div>
          <div class="examples-header">Usage Examples (${item.examples.length})</div>
          <ul class="example-list">
            ${examplesHtml}
          </ul>
        `;
        container.appendChild(card);
      });

      document.getElementById('loadMoreBtn').style.display = currentLimit >= filteredIdioms.length ? 'none' : 'block';
    }

    function filterIdioms() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      filteredIdioms = allIdioms.filter(item => {
        const matchesQuery = item.idiom.toLowerCase().includes(query) || item.meaning.toLowerCase().includes(query);
        const matchesSection = (selectedSection === 'all') || (item.sec === selectedSection);
        return matchesQuery && matchesSection;
      });
      currentLimit = 10;
      renderList();
    }

    function setSection(secKey, btn) {
      selectedSection = secKey;
      document.querySelectorAll('.sec-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterIdioms();
    }

    function loadMore() {
      currentLimit += 10;
      renderList();
    }

    loadDictionary();
  </script>
</body>
</html>
